[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infrascrub"
version = "0.1.0"
description = "Scan an AWS account for wasted spend and security exposures, with the exact fix for each finding."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gloria Nzoh-Ndem" }]
dependencies = [
    "boto3>=1.34",
    "typer>=0.12",
    "pydantic>=2.6",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "moto[ec2,s3,iam]>=5.0",
    "ruff>=0.4",
]

[project.scripts]
infrascrub = "infrascrub.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/infrascrub"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
